<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Staf — Restoran Mahal</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px;">
<div class="card" style="width: 100%; max-width: 400px; padding: 24px;">
    <div style="text-align: center; margin-bottom: 18px;">
        <h1 style="font-size: 1.4rem; color: #111827;">Login Operasional Staf</h1>
        <p style="font-size: 0.875rem; color: #6b7280; margin-top: 4px;">Masuk untuk mengelola antrean dapur & stok menu</p>
    </div>

    <div th:if="${error}"
         style="background: #fee2e2; border: 1px solid #f87171; color: #991b1b; padding: 10px; border-radius: 6px; font-size: 0.875rem; margin-bottom: 14px; text-align: center;"
         th:text="${error}">
        Username atau password salah!
    </div>

    <form th:action="@{/login}" method="post" style="display: flex; flex-direction: column; gap: 14px;">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Masukkan username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Masukkan password" required>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 4px;">Masuk ke Dashboard</button>
    </form>

    <div style="text-align: center; margin-top: 16px;">
        <a th:href="@{/}" style="font-size: 0.85rem; color: #6b7280; text-decoration: none;">← Kembali ke Halaman Pelanggan</a>
    </div>
</div>
</body>
</html>
