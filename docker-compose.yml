services:
  mysql:
    image: mysql:8.4
    container_name: food_reservation_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: food_reservation
      MYSQL_USER: ${MYSQL_USER:-foodapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-foodapp_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DBMiniProjectPBO.sql:/docker-entrypoint-initdb.d/01-food-reservation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food_reservation_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/food_reservation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-foodapp}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-foodapp_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mysql_data:
